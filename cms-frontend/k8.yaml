apiVersion: apps/v1
kind: Deployment
metadata:
  name: cmsfrontendprd-deployment
  namespace: prd
spec:
  selector:
    matchLabels:
      app: cmsfrontendprd
  template:
    metadata:
      labels:
        app: cmsfrontendprd
    spec:
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: agentpool
                    operator: In
                    values:
                      - userpool
      containers:
        - name: cmsfrontendprd
          image: crprdenv.azurecr.io/cmsfrontendprd:latest
          imagePullPolicy: IfNotPresent
          resources:
            requests:
              memory: "5000Mi"
              cpu: "2000m"
            limits:
              memory: "5100Mi"
              cpu: "2512m"
          ports:
            - containerPort: 80
      imagePullSecrets:
        - name: cr-secret


---
apiVersion: v1
kind: Service
metadata:
  name: cmsfrontendprd
spec:
  type: ClusterIP
  selector:
    app: cmsfrontendprd
  ports:
    - port: 80
      targetPort: 80