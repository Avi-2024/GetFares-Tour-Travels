server {
    listen 80;
    listen [::]:80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html index.htm;

    location / {
        proxy_hide_header Connection;


        server_tokens off;


        try_files $uri $uri/ /index.html;
    }

    location = /403.html {
        allow all;
        root /usr/share/nginx/html;
    }

    error_page 403 /403.html;



    error_page 500 502 503 504 /50x.html;

    location = /50x.html {
        root /usr/share/nginx/html;
    }
}